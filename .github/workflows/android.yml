name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Testes unitários
        run: gradle --stacktrace testDebugUnitTest

      - name: Validar build em pull request
        if: github.event_name == 'pull_request'
        run: gradle --stacktrace assembleDebug -PversionCode=${{ github.run_number }}

      - name: Preparar assinatura estável
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: bloquearsites-debug
          ANDROID_KEY_PASSWORD: android
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "HAS_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 não configurado; será usada a assinatura debug padrão."
            exit 0
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bloquearsites-signing.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/bloquearsites-signing.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "HAS_STABLE_SIGNING=true" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/bloquearsites-signing.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Gerar APK
        if: github.event_name == 'push'
        run: gradle --stacktrace assembleDebug -PversionCode=${{ github.run_number }}

      - name: Publicar APK atualizável
        if: github.event_name == 'push' && env.HAS_STABLE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bloquearsites-update
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK de debug
        if: github.event_name == 'push' && env.HAS_STABLE_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bloquearsites-debug
          path: app/build/outputs/apk/debug/app-debug.apk
