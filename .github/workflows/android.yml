name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Testes unitários
        run: gradle --stacktrace testDebugUnitTest

      - name: Validar build em pull request
        if: github.event_name == 'pull_request'
        run: gradle --stacktrace assembleDebug -PversionCode=${{ github.run_number }}

      - name: Preparar assinatura estável
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bloquearsites-signing.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/bloquearsites-signing.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Gerar APK atualizável
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/bloquearsites-signing.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --stacktrace assembleDebug -PversionCode=${{ github.run_number }}

      - name: Publicar APK atualizável
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: bloquearsites-update
          path: app/build/outputs/apk/debug/app-debug.apk
